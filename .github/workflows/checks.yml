# Fast checks on pull requests (~3 min). The full APK build only runs after merging to main.
name: Checks

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Bundles the JavaScript exactly as the APK build would, catching import and bundling errors.
      - name: Bundle for Android
        run: npx expo export --platform android --output-dir /tmp/bundle
