# Builds an installable Android app (.apk) on GitHub's servers.
# Run it from your phone: GitHub app or github.com → Actions → "Build Android APK" → Run workflow.
# The finished APK is attached to a new release under "Releases".
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      # Only build for 64-bit ARM (every modern Android phone) to keep the build fast.
      - name: Build APK
        working-directory: android
        env:
          # Baked into the app so it can tell when a newer release exists.
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -x lintVitalAnalyzeRelease -x lintVitalRelease

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/RussianSpeak-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RussianSpeak-apk
          path: out/*.apk

      - name: Publish release with the APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RussianSpeak build ${{ github.run_number }}
          body: Download the .apk below on your Android phone and open it to install.
          files: out/*.apk
          make_latest: true
